name: Build & publish release image

on:
  release:
    types: [ published ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # github.ref_name is the tag as-is (e.g. "v1.2.3").
          # SETUPTOOLS_SCM_PRETEND_VERSION strips the leading "v" internally,
          # so no separate normalisation step is needed.
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/ignytex-labs/kivoll_worker:${{ github.ref_name }}
